version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techstore_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techstore123}
      POSTGRES_DB: ${POSTGRES_DB:-techstore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - techstore_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techstore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: techstore_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-techstore}:${POSTGRES_PASSWORD:-techstore123}@postgres:5432/${POSTGRES_DB:-techstore}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost", "https://yourdomain.com"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["*"]}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - techstore_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: techstore_frontend
    restart: unless-stopped
    networks:
      - techstore_network

  nginx:
    image: nginx:alpine
    container_name: techstore_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - techstore_network

volumes:
  postgres_data:
  nginx_logs:

networks:
  techstore_network:
    driver: bridge

